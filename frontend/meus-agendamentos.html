<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Agendamentos - Barbearia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>">
  <style>
    body { background: #f4f6f9; }
    .navbar { backdrop-filter: blur(10px); background: rgba(26,26,46,0.95) !important; }
    .navbar-brand { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; }
    .agendamento-card {
      border: none; border-radius: 16px; transition: transform 0.2s, box-shadow 0.2s;
    }
    .agendamento-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
    .status-badge { font-size: 0.8rem; padding: 5px 14px; border-radius: 50px; font-weight: 500; }
    .servico-icon {
      width: 50px; height: 50px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.8); display: none;
      align-items: center; justify-content: center; z-index: 9998;
    }
    .loading-overlay.active { display: flex; }
    .vazio-icon { font-size: 4rem; color: #adb5bd; }
    @media (max-width: 576px) { .agendamento-card .row { flex-direction: column; } }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="text-center">
      <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="mt-2 text-muted">Carregando...</p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="modal fade" id="modalCancelar" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content border-0 rounded-4">
        <div class="modal-body text-center p-4">
          <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
          <h5 class="mt-3 fw-bold">Cancelar Agendamento?</h5>
          <p class="text-muted mb-0" id="cancelarMensagem">Tem certeza que deseja cancelar?</p>
        </div>
        <div class="modal-footer border-0 justify-content-center pb-4 pt-0">
          <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Voltar</button>
          <button type="button" class="btn btn-danger rounded-pill px-4" id="btnConfirmarCancelar">Sim, Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-scissors"></i> Barbearia</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="/agendar">Agendar</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" id="nav-usuario">
              <i class="bi bi-person-circle"></i> Carregando...
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item active" href="/meus-agendamentos"><i class="bi bi-calendar-check"></i> Meus Agendamentos</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" onclick="sair()"><i class="bi bi-box-arrow-left"></i> Sair</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold"><i class="bi bi-calendar-check text-success"></i> Meus Agendamentos</h2>
        <p class="text-muted mb-0" id="subtitulo">Consulte seus horarios agendados</p>
      </div>
      <a href="/agendar" class="btn btn-success rounded-pill px-3">
        <i class="bi bi-plus-lg"></i> Novo Agendamento
      </a>
    </div>

    <div id="agendamentos-container">
      <div class="text-center py-5">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = 'https://api-agendamento-barbearia-1-production.up.railway.app/api';
    let agendamentos = [];

    function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function loading(show) {
      document.getElementById('loadingOverlay').classList.toggle('active', show);
    }

    function toast(mensagem, tipo = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-bg-${tipo} border-0 show`;
      toast.role = 'alert';
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body"><i class="bi bi-${tipo === 'success' ? 'check-circle' : tipo === 'danger' ? 'exclamation-circle' : 'info-circle'}"></i> ${mensagem}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 5000);
    }

    function getToken() {
      const token = localStorage.getItem('token');
      if (!token) { location.href = '/login?redirect=/meus-agendamentos'; return null; }
      return token;
    }

    function sair() {
      localStorage.removeItem('token');
      localStorage.removeItem('usuario');
      location.href = '/';
    }

    function statusClass(status) {
      const map = { pendente: 'warning', confirmado: 'success', cancelado: 'danger', concluido: 'secondary' };
      return map[status] || 'secondary';
    }

    function statusIcon(status) {
      const map = { pendente: 'hourglass-split', confirmado: 'check-circle', cancelado: 'x-circle', concluido: 'check-all' };
      return map[status] || 'question-circle';
    }

    function formatarData(dataStr) {
      const d = new Date(dataStr + 'T12:00:00');
      return d.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    async function carregarAgendamentos() {
      const token = getToken();
      if (!token) return;

      loading(true);
      const container = document.getElementById('agendamentos-container');

      try {
        const res = await fetch(`${API}/cliente/agendamentos`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { localStorage.clear(); location.href = '/login?redirect=/meus-agendamentos'; return; }
        if (!res.ok) throw new Error('Erro ao carregar agendamentos');

        agendamentos = await res.json();

        if (agendamentos.length === 0) {
          container.innerHTML = `
            <div class="text-center py-5">
              <div class="vazio-icon mb-3"><i class="bi bi-calendar-x"></i></div>
              <h5 class="fw-bold">Nenhum agendamento encontrado</h5>
              <p class="text-muted">Voce ainda nao tem nenhum horario agendado.</p>
              <a href="/agendar" class="btn btn-success rounded-pill px-4 mt-2">
                <i class="bi bi-calendar-plus"></i> Agendar Agora
              </a>
            </div>
          `;
          document.getElementById('subtitulo').textContent = 'Voce ainda nao tem agendamentos';
          loading(false);
          return;
        }

        const pendentes = agendamentos.filter(a => a.status === 'pendente' || a.status === 'confirmado').length;
        document.getElementById('subtitulo').textContent = `${agendamentos.length} agendamento(s) — ${pendentes} pendente(s)`;

        container.innerHTML = agendamentos.map(a => {
          const dataFormatada = formatarData(a.data);
          const passou = new Date(a.data + 'T' + a.hora) < new Date();
          const podeCancelar = (a.status === 'pendente' || a.status === 'confirmado') && !passou;
          const servicoNome = esc(a.servico?.nome || 'Servico');
          const barbeiroNome = esc(a.barbeiro?.nome || 'Barbeiro');
          const precoStr = esc((a.servico?.preco || 0).toFixed(2));
          const statusStr = esc(a.status);
          const dataStr = esc(dataFormatada);
          const horaStr = esc(a.hora);
          const duracaoStr = esc(a.servico?.duracao || '?');
          const obs = a.observacao ? esc(a.observacao) : '';

          return `
            <div class="card agendamento-card shadow-sm mb-3">
              <div class="card-body p-4">
                <div class="row align-items-center g-3">
                  <div class="col-auto">
                    <div class="servico-icon bg-${statusClass(a.status)} bg-opacity-10 text-${statusClass(a.status)}">
                      <i class="bi bi-${statusIcon(a.status)}"></i>
                    </div>
                  </div>
                  <div class="col">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
                      <div>
                        <h5 class="fw-bold mb-1">${servicoNome}</h5>
                        <p class="text-muted small mb-1">
                          <i class="bi bi-person-badge"></i> ${barbeiroNome} 
                          &middot; <i class="bi bi-currency-dollar"></i> R$ ${precoStr}
                        </p>
                      </div>
                      <span class="badge bg-${statusClass(a.status)} status-badge">
                        <i class="bi bi-${statusIcon(a.status)}"></i> ${statusStr}
                      </span>
                    </div>
                    <div class="d-flex flex-wrap gap-3 mt-2 text-muted small">
                      <span><i class="bi bi-calendar"></i> ${dataStr}</span>
                      <span><i class="bi bi-clock"></i> ${horaStr}</span>
                      <span><i class="bi bi-clock-history"></i> ${duracaoStr} min</span>
                    </div>
                    ${obs ? `<p class="text-muted small mt-2 mb-0"><i class="bi bi-chat"></i> "${obs}"</p>` : ''}
                  </div>
                  <div class="col-auto">
                    ${podeCancelar ? `<button class="btn btn-outline-danger rounded-pill px-3" onclick="confirmarCancelar(${a.id})"><i class="bi bi-x-circle"></i> Cancelar</button>` : ''}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${esc(err.message)}</div>`;
        toast(err.message, 'danger');
      }
      loading(false);
    }

    let cancelarId = null;

    function confirmarCancelar(id) {
      cancelarId = id;
      const a = agendamentos.find(x => x.id === id);
      const dataStr = a ? formatarData(a.data) + ' as ' + a.hora : '';
      document.getElementById('cancelarMensagem').textContent = `Cancelar agendamento de ${a?.servico?.nome || ''} em ${dataStr}?`;
      new bootstrap.Modal(document.getElementById('modalCancelar')).show();
    }

    document.getElementById('btnConfirmarCancelar').addEventListener('click', async () => {
      if (!cancelarId) return;

      const modal = bootstrap.Modal.getInstance(document.getElementById('modalCancelar'));
      modal.hide();
      loading(true);

      try {
        const token = getToken();
        const res = await fetch(`${API}/cliente/agendamentos/${cancelarId}/cancelar`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) { const err = await res.json(); throw new Error(err.erro); }
        toast('Agendamento cancelado com sucesso!');
        carregarAgendamentos();
      } catch (err) {
        toast(err.message, 'danger');
        loading(false);
      }
      cancelarId = null;
    });

    function atualizarNavbar() {
      const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
      const navEl = document.getElementById('nav-usuario');
      if (usuario) {
        navEl.innerHTML = `<i class="bi bi-person-circle"></i> ${usuario.nome}`;
      }
    }

    atualizarNavbar();
    carregarAgendamentos();
  </script>
</body>
</html>
