<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Login | Barbearia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; align-items: center; min-height: 100vh;
    }
    .login-card { border: none; border-radius: 20px; overflow: hidden; }
    .login-card .card-body { padding: 45px; }
    .login-card .card-header {
      background: linear-gradient(135deg, #198754, #20c997);
      padding: 30px; text-align: center; border: none;
    }
    .login-card .card-header h4 { color: white; font-weight: 700; }
    .login-card .card-header p { color: rgba(255,255,255,0.8); font-size: 0.9rem; }
    .login-icon {
      width: 70px; height: 70px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 15px;
    }
    .login-icon i { font-size: 2rem; color: white; }
    .form-control:focus { border-color: #198754; box-shadow: 0 0 0 0.2rem rgba(25,135,84,0.15); }
    .btn-login {
      padding: 12px; font-weight: 600; border-radius: 50px;
      background: linear-gradient(135deg, #198754, #20c997);
      border: none; transition: transform 0.2s;
    }
    .btn-login:hover { transform: translateY(-2px); }
    .btn-login:disabled { opacity: 0.7; transform: none; }
    .back-link { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: white; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card login-card shadow-lg border-0">
          <div class="card-header">
            <div class="login-icon">
              <i class="bi bi-shield-lock"></i>
            </div>
            <h4>Painel Administrativo</h4>
            <p class="mb-0">Acesso restrito ao administrador</p>
          </div>
          <div class="card-body">
            <form id="form-login" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control form-control-lg" id="email" placeholder="seu@email.com" required>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control form-control-lg" id="senha" placeholder="Sua senha" required>
                </div>
              </div>
              <div id="erro-login" class="alert alert-danger d-none d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle"></i> <span></span>
              </div>
              <button type="submit" class="btn btn-login btn-lg text-white w-100" id="btn-entrar">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
              </button>
            </form>
          </div>
        </div>
        <div class="text-center mt-3">
          <a href="/" class="back-link"><i class="bi bi-arrow-left"></i> Voltar ao site</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = '/api';

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const btn = document.getElementById('btn-entrar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Entrando...';

      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const erroEl = document.getElementById('erro-login');
      erroEl.classList.add('d-none');

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.erro || 'Credenciais invalidas');
        }

        const data = await res.json();
        if (data.usuario.role !== 'admin') throw new Error('Acesso restrito a administradores');

        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        location.href = '/admin/dashboard.html';
      } catch (err) {
        erroEl.querySelector('span').textContent = err.message;
        erroEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrar';
      }
    });
  </script>
</body>
</html>
