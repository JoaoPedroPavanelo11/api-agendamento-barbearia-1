<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Barbearia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh; display: flex; align-items: center;
    }
    .auth-card { border: none; border-radius: 20px; overflow: hidden; }
    .auth-card .card-body { padding: 40px; }
    .auth-header {
      background: linear-gradient(135deg, #198754, #20c997);
      padding: 30px; text-align: center; border: none;
    }
    .auth-header h4 { color: white; font-weight: 700; }
    .auth-header p { color: rgba(255,255,255,0.8); font-size: 0.9rem; }
    .auth-icon {
      width: 70px; height: 70px; border-radius: 50%;
      background: rgba(255,255,255,0.2); display: flex;
      align-items: center; justify-content: center; margin: 0 auto 15px;
    }
    .auth-icon i { font-size: 2rem; color: white; }
    .form-control:focus { border-color: #198754; box-shadow: 0 0 0 0.2rem rgba(25,135,84,0.15); }
    .btn-auth {
      padding: 12px; font-weight: 600; border-radius: 50px;
      background: linear-gradient(135deg, #198754, #20c997);
      border: none; transition: transform 0.2s;
    }
    .btn-auth:hover { transform: translateY(-2px); }
    .btn-auth:disabled { opacity: 0.7; transform: none; }
    .tab-btn {
      background: none; border: none; padding: 8px 20px;
      font-weight: 600; color: #6c757d; border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active { color: #198754; border-bottom-color: #198754; }
    .tab-btn:hover { color: #198754; }
    .back-link { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: white; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card auth-card shadow-lg border-0">
          <div class="auth-header">
            <div class="auth-icon">
              <i class="bi bi-person-circle"></i>
            </div>
            <h4>Barbearia</h4>
            <p class="mb-0">Entre para agendar seu horario</p>
          </div>
          <div class="card-body">
            <div class="d-flex justify-content-center mb-4 gap-3">
              <button class="tab-btn active" id="tabLogin" onclick="mostrarAba('login')">Entrar</button>
              <button class="tab-btn" id="tabCadastro" onclick="mostrarAba('cadastro')">Cadastrar</button>
            </div>

            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="seu@email.com" required>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control form-control-lg" id="loginSenha" placeholder="Sua senha" required>
                </div>
              </div>
              <div id="erroLogin" class="alert alert-danger d-none d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle"></i> <span></span>
              </div>
              <button type="submit" class="btn btn-auth text-white w-100 btn-lg" id="btnLogin">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
              </button>
              <p class="text-center text-muted small mt-3 mb-0">
                Ao agendar, sua senha sera criada automaticamente com os digitos do seu telefone.
              </p>
            </form>

            <form id="formCadastro" style="display:none;" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold">Nome</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control form-control-lg" id="cadastroNome" placeholder="Seu nome completo" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control form-control-lg" id="cadastroEmail" placeholder="seu@email.com" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Telefone</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                  <input type="text" class="form-control form-control-lg" id="cadastroTelefone" placeholder="(11) 99999-8888" maxlength="16" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control form-control-lg" id="cadastroSenha" placeholder="Minimo 8 caracteres" minlength="8" required>
                </div>
                <div class="form-text">Minimo de 8 caracteres.</div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Confirmar Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" class="form-control form-control-lg" id="cadastroSenhaConfirm" placeholder="Repita a senha" minlength="8" required>
                </div>
              </div>
              <div id="erroCadastro" class="alert alert-danger d-none d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle"></i> <span></span>
              </div>
              <button type="submit" class="btn btn-auth text-white w-100 btn-lg" id="btnCadastro">
                <i class="bi bi-person-plus"></i> Cadastrar e Entrar
              </button>
            </form>
          </div>
        </div>
        <div class="text-center mt-3">
          <a href="/" class="back-link"><i class="bi bi-arrow-left"></i> Voltar ao site</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>

    function mascaraTelefone(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 6) v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
      else if (v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
      else if (v.length > 0) v = `(${v}`;
      input.value = v;
    }

    document.getElementById('cadastroTelefone').addEventListener('input', function() {
      mascaraTelefone(this);
    });

    function mostrarAba(aba) {
      document.getElementById('formLogin').style.display = aba === 'login' ? 'block' : 'none';
      document.getElementById('formCadastro').style.display = aba === 'cadastro' ? 'block' : 'none';
      document.getElementById('tabLogin').classList.toggle('active', aba === 'login');
      document.getElementById('tabCadastro').classList.toggle('active', aba === 'cadastro');
      document.getElementById('erroLogin').classList.add('d-none');
      document.getElementById('erroCadastro').classList.add('d-none');
    }

    function redirectAposLogin() {
      const destino = new URLSearchParams(location.search).get('redirect') || '/agendar';
      location.href = destino;
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Entrando...';

      const email = document.getElementById('loginEmail').value;
      const senha = document.getElementById('loginSenha').value;
      const erroEl = document.getElementById('erroLogin');
      erroEl.classList.add('d-none');

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        if (!res.ok) { const err = await res.json(); throw new Error(err.erro); }
        const data = await res.json();
        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        redirectAposLogin();
      } catch (err) {
        erroEl.querySelector('span').textContent = err.message;
        erroEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrar';
      }
    });

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const btn = document.getElementById('btnCadastro');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Cadastrando...';

      const nome = document.getElementById('cadastroNome').value;
      const email = document.getElementById('cadastroEmail').value;
      const telefone = document.getElementById('cadastroTelefone').value;
      const senha = document.getElementById('cadastroSenha').value;
      const senhaConfirm = document.getElementById('cadastroSenhaConfirm').value;
      const erroEl = document.getElementById('erroCadastro');
      erroEl.classList.add('d-none');

      if (senha !== senhaConfirm) {
        erroEl.querySelector('span').textContent = 'Senhas nao conferem';
        erroEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus"></i> Cadastrar e Entrar';
        return;
      }

      try {
        const cadastroRes = await fetch(`${API}/auth/cadastrar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha, telefone })
        });
        if (!cadastroRes.ok) { const err = await cadastroRes.json(); throw new Error(err.erro); }

        const loginRes = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        if (!loginRes.ok) throw new Error('Erro ao autenticar apos cadastro');
        const data = await loginRes.json();
        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        redirectAposLogin();
      } catch (err) {
        erroEl.querySelector('span').textContent = err.message;
        erroEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus"></i> Cadastrar e Entrar';
      }
    });
  </script>
</body>
</html>
